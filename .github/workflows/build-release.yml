name: Build & Release (Android APK & Windows EXE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. BUILD WINDOWS EXECUTABLE (.EXE)
  # ============================================================================
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Package Windows .EXE
        run: |
          cd frontend
          npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            frontend/release/*.exe
            frontend/release/*.exe.blockmap
          retention-days: 7

  # ============================================================================
  # 2. BUILD & SIGN ANDROID APK (.APK)
  # ============================================================================
  build-android:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Prepare Capacitor Android Project
        run: |
          cd frontend
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Release APK
        run: |
          cd frontend/android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign Android APK for In-Place Updates
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          DEFAULT_PASS="OmniResearch2026!"
          DEFAULT_ALIAS="omniresearch"
          STORE_PASS="${KEYSTORE_PASSWORD:-$DEFAULT_PASS}"
          KEY_PASS="${KEY_PASSWORD:-$DEFAULT_PASS}"
          ALIAS="${KEY_ALIAS:-$DEFAULT_ALIAS}"

          # Setup persistent keystore: from secret if provided, else generate repo-consistent keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Loaded persistent keystore from GitHub Secret."
          else
            echo "Generating persistent keystore..."
            keytool -genkey -v \
              -keystore release.keystore \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=OmniResearch, OU=Production, O=OmniResearch, L=Global, ST=Tech, C=US"
          fi

          # Locate unsigned APK
          APK_PATH=$(find frontend/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK to sign: $APK_PATH"

          # Find apksigner in Android build-tools
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          # Sign with both v2 and v3 signature schemes (required for seamless in-place updates)
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out OmniResearch-release-signed.apk \
            "$APK_PATH"

          # Verify signature
          $APKSIGNER verify --verbose OmniResearch-release-signed.apk

      - name: Upload Signed Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: OmniResearch-release-signed.apk
          retention-days: 7

  # ============================================================================
  # 3. CREATE GITHUB RELEASE WITH DIRECT DOWNLOADS
  # ============================================================================
  publish-release:
    name: Publish Release (APK & EXE)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/windows

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets/android

      - name: Prepare Release Assets
        id: assets
        run: |
          mkdir -p final-assets
          # Copy signed APK
          cp release-assets/android/OmniResearch-release-signed.apk final-assets/OmniResearch-release.apk
          # Copy Windows executables (installer & portable)
          cp release-assets/windows/*.exe final-assets/ || true
          ls -la final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OmniResearch v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## OmniResearch Automated Release 🚀
            
            Every commit automatically builds and signs production packages for Android and Windows.
            
            ### Downloads:
            - 📱 **Android App (Signed APK)**: `OmniResearch-release.apk`
              - *In-place update support enabled: install directly over previous version without deleting data.*
            - 💻 **Windows Desktop App**: `OmniResearch-Setup-*.exe`
            
            ### What's New:
            - Real-time Similarweb, SocialBlade, vidIQ, SparkToro & Google Trends intelligence.
            - Built-in 4-second loading splash with automatic update verification.
          files: |
            final-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

