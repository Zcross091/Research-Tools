name: Release APK

on:
  workflow_run:
    workflows: ["Build APK"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release-apk:
    name: Publish Signed APK Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Signed APK from Build Run
        uses: actions/download-artifact@v4
        with:
          name: signed-apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-asset

      - name: Verify Signed APK File
        run: |
          ls -la release-asset/
          if [ ! -f "release-asset/OmniResearch-release.apk" ]; then
            echo "Searching for downloaded APK..."
            find release-asset/ -name "*.apk"
          fi

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: OmniResearch PRO v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## OmniResearch PRO Release 📱💻
            
            Enterprise multi-channel market, competitor, keyword and site audit intelligence suite.
            
            ### ✨ In-Place Updates Guaranteed
            - Direct upgrade: signed with permanent release certificate.
            - All local data and configuration are preserved automatically.
          files: |
            release-asset/OmniResearch-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

